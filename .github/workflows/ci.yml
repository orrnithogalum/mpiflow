# Pipeline GitHub Actions du projet mpiflow (M2 CHPS, CHPS0902, Cours 6)
#
#   Mission 1 : build -> test (artefact + needs)
#   Mission 2 : lint (pull requests), package (tags vX.Y.Z), secret via --password-stdin
#   Mission 3 : test_slurm sur ROMEO, par SSH depuis un runner auto-hébergé (étiquette romeo-ssh)
#
# Réglages du dépôt (posés par scripts/github_evidence.py, romeo/romeo.sh et romeo/runner.sh) :
#   secret FAKE_REGISTRY_TOKEN   fausse valeur, dans l'environnement « release »
#                                (limité aux tags v*) ou, à défaut, au niveau du dépôt
#   variable HPC_ENABLED=true    tant que le runner romeo-ssh est enregistré
#   variables ROMEO_HOST, SBATCH_ACCOUNT, SBATCH_PARTITION, SBATCH_CONSTRAINT...
name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']    # vX.Y.Z seulement : v1.2.3-rc1 ne déclenche rien
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'               # nightly, 2 h 17 à Paris (heure d'hiver)
  workflow_dispatch:
    inputs:
      hpc:
        description: Lancer test_slurm sur le cluster
        type: boolean
        default: true
      methode:
        description: Suivi du job Slurm
        type: choice
        options: [polling, wait]
        default: polling
      sbatch_opts:
        description: Options sbatch supplémentaires
        type: string
        default: ''
      publier:
        description: Forcer le job package hors tag (démonstration de la protection)
        type: boolean
        default: false

defaults:
  run:
    shell: bash                        # bash -e -o pipefail

env:
  DEBIAN_FRONTEND: noninteractive
  # Open MPI dans un conteneur : ptrace entre processus interdit -> pas de copie CMA
  OMPI_MCA_btl_vader_single_copy_mechanism: none

jobs:
  # ===================================================== Mission 2 : lint ======
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
      - run: >-
          cppcheck --enable=warning,style,performance,portability --std=c11
          --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem tests/

  # ===================================================== Mission 1 =============
  build:
    runs-on: ubuntu-24.04
    container: gcc:13-bookworm
    steps:
      - uses: actions/checkout@v7
      # l'image détourne /usr/bin/gfortran (dpkg-divert) : sans ce lien vers le sien,
      # le paquet gfortran tiré par libopenmpi-dev échoue (update-alternatives)
      - run: |
          ln -sf /usr/local/bin/gfortran /usr/bin/gfortran
          apt-get update -qq && apt-get install -y -qq cmake libopenmpi-dev openmpi-bin > /dev/null
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMPIEXEC_PREFLAGS="--allow-run-as-root;--oversubscribe"
          cmake --build build -j"$(nproc)"
      # upload-artifact ne conserve pas les permissions (bit x perdu) : archive tar
      - run: tar -cf build.tar build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build.tar
          retention-days: 7

  test:
    needs: build                       # mission 1 : sans needs, test démarre en même temps que build
    runs-on: ubuntu-24.04
    container: gcc:13-bookworm
    steps:
      - uses: actions/checkout@v7
      - run: |                         # lien gfortran : voir le job build
          ln -sf /usr/local/bin/gfortran /usr/bin/gfortran
          apt-get update -qq && apt-get install -y -qq cmake libopenmpi-dev openmpi-bin > /dev/null
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: tar -xf build.tar
      - run: cd build && ctest --output-on-failure
      - run: mpirun --allow-run-as-root --oversubscribe -np 4 build/tests/test_mpi

  # ===================================================== Mission 2 : secret ====
  registry_login:                      # le secret est-il visible hors de l'environnement release ?
    runs-on: ubuntu-24.04
    env:
      FAKE_REGISTRY_TOKEN: ${{ secrets.FAKE_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "ref=${GITHUB_REF} événement=${GITHUB_EVENT_NAME}"
          if [ -z "${FAKE_REGISTRY_TOKEN}" ]; then
            echo "FAKE_REGISTRY_TOKEN vide : secret non transmis à ce job"
            exit 0
          fi
          echo "test de masquage : ${FAKE_REGISTRY_TOKEN}"
          echo "${FAKE_REGISTRY_TOKEN}" | ./scripts/fake_docker_login.sh -u ci-user --password-stdin ghcr.io

  # ===================================================== Mission 2 : package ===
  package:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
    runs-on: ubuntu-24.04
    environment: release               # secret protégé : uniquement pour les tags v*
    env:
      TAG: ${{ github.ref_name }}
      FAKE_REGISTRY_TOKEN: ${{ secrets.FAKE_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: |
          tar -xf build.tar
          PKG="mpiflow-${TAG}-linux-x86_64"
          mkdir -p "dist/$PKG/bin" && cp build/tests/test_mpi "dist/$PKG/bin/" && cp README.md "dist/$PKG/"
          printf 'tag=%s\ncommit=%s\nrun=%s\n' "$TAG" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "dist/$PKG/BUILDINFO.txt"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          cd dist && sha256sum "$PKG.tar.gz" | tee checksums.txt
      - run: |
          echo "test de masquage : ${FAKE_REGISTRY_TOKEN}"
          echo "${FAKE_REGISTRY_TOKEN}" | ./scripts/fake_docker_login.sh -u ci-user --password-stdin ghcr.io
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            dist/*.tar.gz
            dist/checksums.txt

  # ===================================================== Mission 3 =============
  # Le runner tourne sur le poste de l'étudiant (romeo/runner.sh) et atteint ROMEO par SSH :
  # aucune clé n'est confiée à GitHub et rien ne tourne en permanence sur le nœud de connexion.
  test_slurm:
    needs: test                        # pas de cluster si les tests unitaires échouent
    if: >-
      vars.HPC_ENABLED == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.hpc))
    runs-on: [self-hosted, romeo-ssh]
    timeout-minutes: 30                # le wall-time Slurm ne compte pas l'attente en file
    env:
      ROMEO_HOST: ${{ vars.ROMEO_HOST }}
      ROMEO_ENV: ${{ vars.ROMEO_ENV }}
      SBATCH_ACCOUNT: ${{ vars.SBATCH_ACCOUNT }}
      SBATCH_PARTITION: ${{ vars.SBATCH_PARTITION }}
      SBATCH_CONSTRAINT: ${{ vars.SBATCH_CONSTRAINT }}
      SBATCH_QOS: ${{ vars.SBATCH_QOS }}
      MPI_LAUNCHER: ${{ vars.MPI_LAUNCHER }}
      POLL_INTERVAL: 15
      METHODE: ${{ inputs.methode || 'polling' }}
      SBATCH_OPTS: ${{ inputs.sbatch_opts }}
    steps:
      - uses: actions/checkout@v7
      - name: Copie du dépôt sur ROMEO
        run: bash romeo/ci_ssh.sh sync
      - name: Compilation, soumission et suivi sur ROMEO
        timeout-minutes: 25            # < timeout du job : l'étape de nettoyage a le temps de tourner
        run: |
          read -ra opts <<< "$SBATCH_OPTS"
          bash romeo/ci_ssh.sh run "${opts[@]}"
      - name: Annuler le job Slurm s'il est encore dans la file
        if: always()                   # aussi après annulation ou dépassement du timeout
        run: bash romeo/ci_ssh.sh cancel
      - name: Rapatrier les sorties du job
        if: always()
        run: bash romeo/ci_ssh.sh fetch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slurm-logs
          path: |
            ci-*.out
            sacct-*.txt
          if-no-files-found: ignore
